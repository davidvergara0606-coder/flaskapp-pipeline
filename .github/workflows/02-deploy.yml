# Pipeline 2: CI/CD a AWS EC2
#   Lint -> Unit Tests -> Integration Tests (MySQL real) -> Migration -> Deploy
#
# Supone una app Flask con Flask-Migrate (Alembic):
#   wsgi.py (expone `app`), requirements.txt, migrations/,
#   tests/unit/, tests/integration/, y un endpoint GET /health
#
# Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY (en los environments staging/production)

name: 02 - CI/CD Deploy EC2

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  APP_DIR: /opt/flaskapp

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install flake8 black isort
      - run: black --check .
      - run: isort --check-only --profile black .
      - run: flake8 . --max-line-length=100 --exclude=venv,migrations

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Pytest (SQLite en memoria)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: test
        run: pytest tests/unit --cov=. --cov-report=xml --junitxml=unit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            unit-results.xml
            coverage.xml

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: mysql+pymysql://app:app@127.0.0.1:3306/app_test
      SECRET_KEY: test
      FLASK_APP: wsgi.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Validar migraciones contra MySQL (upgrade -> downgrade -> upgrade)
        run: |
          flask db upgrade
          flask db downgrade base
          flask db upgrade
      - run: pytest tests/integration --junitxml=integration-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-results.xml

  migrate:
    name: Migration
    needs: integration-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Subir código a la carpeta de release
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete --exclude=.git --exclude=.github --exclude=tests
          path: ./
          remote_path: ${{ env.APP_DIR }}/releases/${{ github.sha }}/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: Backup + instalar dependencias + flask db upgrade
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,SHA
          script: |
            set -euo pipefail
            REL="$APP_DIR/releases/$SHA"
            set -a; source <(sudo cat "$APP_DIR/.env"); set +a

            # Backup antes de migrar
            DB=$(echo "$DATABASE_URL" | sed -E 's#.*/([^/?]+).*#\1#')
            U=$(echo "$DATABASE_URL" | sed -E 's#.*://([^:]+):.*#\1#')
            P=$(echo "$DATABASE_URL" | sed -E 's#.*://[^:]+:([^@]+)@.*#\1#')
            MYSQL_PWD="$P" mysqldump -u"$U" -h127.0.0.1 --single-transaction --no-tablespaces "$DB" \
              | gzip > "$APP_DIR/backups/pre-deploy-$SHA.sql.gz"

            "$APP_DIR/venv/bin/pip" install -q -r "$REL/requirements.txt"
            cd "$REL" && "$APP_DIR/venv/bin/flask" db upgrade

  deploy:
    name: Deploy
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Activar release y reiniciar Gunicorn
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,SHA
          script: |
            set -euo pipefail
            PREV=$(readlink -f "$APP_DIR/app" || true)
            [ -L "$APP_DIR/app" ] || sudo rm -rf "$APP_DIR/app"
            ln -sfn "$APP_DIR/releases/$SHA" "$APP_DIR/app"
            sudo systemctl restart flaskapp
            sleep 5

            if ! curl -fsS http://localhost/health; then
              echo "Health check falló -> rollback a $PREV"
              [ -n "$PREV" ] && ln -sfn "$PREV" "$APP_DIR/app" && sudo systemctl restart flaskapp
              exit 1
            fi

            # Conservar solo las 5 últimas releases
            ls -1dt "$APP_DIR"/releases/* | tail -n +6 | xargs -r rm -rf
